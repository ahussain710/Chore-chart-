<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Chore Chart" />
  <meta name="theme-color" content="#ff6b6b" />
  <title>⭐ Chore Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff8f0; font-family: 'Nunito', sans-serif; }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideIn { from { transform: translateY(-20px) translateX(-50%); opacity: 0; } to { transform: translateY(0) translateX(-50%); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    ::-webkit-scrollbar { height: 4px; }
    ::-webkit-scrollbar-track { background: #ffe8d0; }
    ::-webkit-scrollbar-thumb { background: #ff9f1c; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const STORAGE_KEY = "chore-chart-data-v2";

    const DEFAULT_CHORES = [
      { id: "c1",  name: "Make Bed",        emoji: "🛏️", stars: 1 },
      { id: "c2",  name: "Brush Teeth",     emoji: "🦷", stars: 1 },
      { id: "c3",  name: "Tidy Room",       emoji: "🧹", stars: 2 },
      { id: "c4",  name: "Do Homework",     emoji: "📚", stars: 2 },
      { id: "c5",  name: "Help Mum",        emoji: "👩", stars: 2 },
      { id: "c6",  name: "Help Dad",        emoji: "👨", stars: 2 },
      { id: "c7",  name: "Change Clothes",  emoji: "👕", stars: 1 },
      { id: "c8",  name: "Be Nice",         emoji: "😊", stars: 2 },
      { id: "c9",  name: "Eat Food on Time",emoji: "🍱", stars: 1 },
      { id: "c10", name: "No Shouting",     emoji: "🤫", stars: 2 },
      { id: "c11", name: "No Crying",       emoji: "😌", stars: 2 },
      { id: "c12", name: "No Fighting",     emoji: "🤝", stars: 3 },
    ];

    const DEFAULT_REWARDS = [
      { id: "r1", name: "Extra Screen Time", emoji: "📱", cost: 5  },
      { id: "r2", name: "Choose Dinner",     emoji: "🍕", cost: 8  },
      { id: "r3", name: "Stay Up Late",      emoji: "🌙", cost: 10 },
      { id: "r4", name: "Movie Night Pick",  emoji: "🎬", cost: 12 },
      { id: "r5", name: "Special Outing",    emoji: "🎡", cost: 20 },
    ];

    const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

    function getWeekKey() {
      const now = new Date();
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(new Date().setDate(diff));
      return `${monday.getFullYear()}-W${String(monday.getMonth()+1).padStart(2,"0")}-${String(monday.getDate()).padStart(2,"0")}`;
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return { chores: DEFAULT_CHORES, rewards: DEFAULT_REWARDS, completions: {}, totalStars: 0, history: [] };
    }

    function saveData(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
    }

    // ── Confetti ──────────────────────────────────────────────────────────────
    function Confetti({ active }) {
      if (!active) return null;
      const colors = ["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff6bef","#ff9f1c"];
      const pieces = Array.from({length:24},(_,i)=>({
        id:i, color:colors[i%6],
        left: Math.random()*100,
        delay: Math.random()*0.5,
        size: 8+Math.random()*8,
        round: Math.random()>0.5
      }));
      return (
        <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:9999,overflow:"hidden"}}>
          {pieces.map(p=>(
            <div key={p.id} style={{
              position:"absolute", left:`${p.left}%`, top:"-20px",
              width:p.size, height:p.size,
              borderRadius: p.round?"50%":"2px",
              background:p.color,
              animation:`confettiFall 1.4s ease-in ${p.delay}s forwards`
            }}/>
          ))}
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────
    function App() {
      const [view, setView]       = useState("chart");
      const [role, setRole]       = useState(null);
      const [data, setData]       = useState(loadData);
      const [confetti, setConfetti] = useState(false);
      const [toast, setToast]     = useState(null);
      const [newChore, setNewChore]   = useState({name:"",emoji:"✨",stars:1});
      const [newReward, setNewReward] = useState({name:"",emoji:"🎁",cost:5});
      const weekKey = getWeekKey();

      const update = useCallback((newData) => {
        setData(newData);
        saveData(newData);
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(()=>setToast(null), 2500);
      };

      const boom = () => {
        setConfetti(true);
        setTimeout(()=>setConfetti(false), 1600);
      };

      const toggleChore = (choreId, dayIdx) => {
        if (role !== "kid") return;
        const key = `${choreId}-${dayIdx}`;
        const wc = data.completions[weekKey] || {};
        const was = !!wc[key];
        const chore = data.chores.find(c=>c.id===choreId);
        const newWc = {...wc, [key]: !was};
        if (was) delete newWc[key];
        const newTotal = Math.max(0, data.totalStars + (was ? -chore.stars : chore.stars));
        update({...data, completions:{...data.completions,[weekKey]:newWc}, totalStars:newTotal});
        if (!was) { boom(); showToast(`+${chore.stars} ⭐ for ${chore.name}!`); }
      };

      const claimReward = (r) => {
        if (role !== "kid") return;
        if (data.totalStars < r.cost) { showToast(`Need ${r.cost-data.totalStars} more ⭐!`); return; }
        const hist = [{date:new Date().toLocaleDateString(),action:`Claimed: ${r.name}`,stars:-r.cost},...(data.history||[])].slice(0,30);
        update({...data, totalStars:data.totalStars-r.cost, history:hist});
        boom(); showToast(`🎉 Claimed ${r.emoji} ${r.name}!`);
      };

      const addChore = () => {
        if (!newChore.name.trim()) return;
        update({...data, chores:[...data.chores,{id:`c${Date.now()}`,...newChore}]});
        setNewChore({name:"",emoji:"✨",stars:1}); showToast("Chore added!");
      };
      const removeChore = id => update({...data, chores:data.chores.filter(c=>c.id!==id)});

      const addReward = () => {
        if (!newReward.name.trim()) return;
        update({...data, rewards:[...data.rewards,{id:`r${Date.now()}`,...newReward}]});
        setNewReward({name:"",emoji:"🎁",cost:5}); showToast("Reward added!");
      };
      const removeReward = id => update({...data, rewards:data.rewards.filter(r=>r.id!==id)});

      const resetWeek = () => { update({...data,completions:{...data.completions,[weekKey]:{}}}); showToast("Week reset!"); };

      const adjustStars = (n) => update({...data, totalStars:Math.max(0,data.totalStars+n)});

      const shareApp = () => {
        const url = window.location.href;
        if (navigator.share) {
          navigator.share({title:"⭐ Chore Chart", text:"Track our chores and earn rewards!", url});
        } else {
          navigator.clipboard.writeText(url).then(()=>showToast("Link copied! 📋")).catch(()=>showToast("Copy the URL from your browser bar"));
        }
      };

      // ── Role picker ────────────────────────────────────────────────────────
      if (!role) return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
          background:"linear-gradient(135deg,#fff8f0,#ffeedd)",padding:20}}>
          <div style={{background:"#fff",borderRadius:28,padding:"40px 28px",textAlign:"center",
            boxShadow:"0 8px 40px rgba(255,107,107,0.18)",maxWidth:380,width:"100%",animation:"fadeIn .4s ease"}}>
            <div style={{fontFamily:"'Fredoka One',cursive",fontSize:34,color:"#ff6b6b",marginBottom:6}}>⭐ Chore Chart ⭐</div>
            <p style={{fontSize:19,color:"#666",margin:"0 0 26px",fontWeight:700}}>Who are you?</p>
            <div style={{display:"flex",gap:14,justifyContent:"center",marginBottom:22}}>
              {[["kid","🧒","I'm a Kid!","linear-gradient(135deg,#ff6b6b,#ff9f1c)"],
                ["parent","👨‍👩‍👧","I'm a Parent","linear-gradient(135deg,#4d96ff,#6bcb77)"]].map(([r,em,label,bg])=>(
                <button key={r} onClick={()=>setRole(r)} style={{
                  display:"flex",flexDirection:"column",alignItems:"center",gap:8,
                  background:bg,border:"none",borderRadius:20,padding:"22px 24px",
                  cursor:"pointer",boxShadow:"0 4px 16px rgba(0,0,0,0.15)"}}>
                  <span style={{fontSize:44}}>{em}</span>
                  <span style={{fontFamily:"'Fredoka One',cursive",fontSize:17,color:"#fff"}}>{label}</span>
                </button>
              ))}
            </div>
            <p style={{fontSize:13,color:"#aaa",lineHeight:1.5}}>
              📱 Add this page to your Home Screen to use it like an app!
            </p>
          </div>
        </div>
      );

      const wc = data.completions[weekKey] || {};
      const weekStars = data.chores.reduce((s,c)=>s+DAYS.reduce((ss,_,di)=>ss+(wc[`${c.id}-${di}`]?c.stars:0),0),0);

      return (
        <div style={{fontFamily:"'Nunito',sans-serif",minHeight:"100vh",background:"linear-gradient(135deg,#fff8f0,#ffeedd)",paddingBottom:40}}>
          <Confetti active={confetti}/>

          {/* Toast */}
          {toast && <div style={{
            position:"fixed",top:76,left:"50%",
            transform:"translateX(-50%)",
            background:"#333",color:"#fff",borderRadius:16,padding:"11px 22px",
            fontFamily:"'Fredoka One',cursive",fontSize:15,zIndex:9998,
            boxShadow:"0 4px 20px rgba(0,0,0,0.25)",animation:"slideIn .25s ease",whiteSpace:"nowrap"
          }}>{toast}</div>}

          {/* Header */}
          <div style={{background:"linear-gradient(90deg,#ff6b6b,#ff9f1c)",padding:"14px 18px",
            display:"flex",alignItems:"center",justifyContent:"space-between",
            boxShadow:"0 4px 16px rgba(255,107,107,0.3)"}}>
            <div>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:24,color:"#fff"}}>⭐ Chore Chart</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.85)",fontWeight:700}}>
                {role==="kid"?"🧒 Kid Mode":"👨‍👩‍👧 Parent Mode"}
              </div>
            </div>
            <div style={{background:"rgba(255,255,255,0.22)",borderRadius:14,padding:"7px 14px",
              display:"flex",alignItems:"center",gap:5}}>
              <span style={{fontSize:18}}>⭐</span>
              <span style={{fontFamily:"'Fredoka One',cursive",fontSize:24,color:"#fff"}}>{data.totalStars}</span>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.8)",fontWeight:700}}>stars</span>
            </div>
          </div>

          {/* Nav */}
          <div style={{display:"flex",gap:8,padding:"10px 14px",background:"#fff",
            borderBottom:"2px solid #ffe8d0",alignItems:"center",overflowX:"auto"}}>
            {["chart","rewards",...(role==="parent"?["manage"]:[])].map(v=>(
              <button key={v} onClick={()=>setView(v)} style={{
                border:"2px solid "+(view===v?"transparent":"#ffe0c0"),
                borderRadius:12,padding:"7px 14px",
                background:view===v?"linear-gradient(135deg,#ff6b6b,#ff9f1c)":"#fff",
                fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:13,
                cursor:"pointer",color:view===v?"#fff":"#888",whiteSpace:"nowrap"}}>
                {v==="chart"?"📋 Chart":v==="rewards"?"🎁 Rewards":"⚙️ Manage"}
              </button>
            ))}
            <button onClick={()=>setRole(null)} style={{
              marginLeft:"auto",border:"2px solid #ddd",borderRadius:10,padding:"5px 11px",
              background:"#f8f8f8",fontFamily:"'Nunito',sans-serif",fontWeight:700,
              fontSize:12,cursor:"pointer",color:"#aaa",whiteSpace:"nowrap"}}>Switch</button>
          </div>

          {/* ── Chart ── */}
          {view==="chart" && (
            <div style={{maxWidth:860,margin:"0 auto",padding:"18px 14px"}}>
              <div style={{background:"#fff",borderRadius:16,padding:"11px 18px",
                display:"flex",justifyContent:"space-between",alignItems:"center",
                fontWeight:700,fontSize:15,color:"#555",marginBottom:14,
                boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
                <span>This Week: <strong>{weekStars} ⭐</strong> earned</span>
                {role==="parent" && (
                  <button onClick={resetWeek} style={{background:"#ff6b6b",color:"#fff",border:"none",
                    borderRadius:10,padding:"5px 13px",fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                    Reset Week
                  </button>
                )}
              </div>
              <div style={{overflowX:"auto",borderRadius:20,boxShadow:"0 4px 24px rgba(0,0,0,0.08)",background:"#fff"}}>
                <table style={{width:"100%",borderCollapse:"collapse",minWidth:480}}>
                  <thead>
                    <tr>
                      <th style={{background:"linear-gradient(135deg,#ff6b6b,#ff9f1c)",color:"#fff",
                        fontFamily:"'Fredoka One',cursive",fontSize:14,padding:"11px 10px",textAlign:"left",minWidth:130}}>Chore</th>
                      <th style={{background:"linear-gradient(135deg,#ff6b6b,#ff9f1c)",color:"#fff",
                        fontFamily:"'Fredoka One',cursive",fontSize:14,padding:"11px 6px",width:44,textAlign:"center"}}>⭐</th>
                      {DAYS.map(d=>(
                        <th key={d} style={{background:"linear-gradient(135deg,#ff6b6b,#ff9f1c)",color:"#fff",
                          fontFamily:"'Fredoka One',cursive",fontSize:13,padding:"11px 4px",width:40,textAlign:"center"}}>{d}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {data.chores.map((chore,ri)=>(
                      <tr key={chore.id} style={{background:ri%2===0?"#fff9f0":"#fff"}}>
                        <td style={{padding:"10px 10px",fontWeight:700,fontSize:13,color:"#333"}}>
                          <span style={{fontSize:18,marginRight:5}}>{chore.emoji}</span>{chore.name}
                        </td>
                        <td style={{textAlign:"center",fontSize:12,color:"#f6a21e",fontWeight:700,padding:"10px 4px"}}>
                          {chore.stars}⭐
                        </td>
                        {DAYS.map((_,di)=>{
                          const done = !!wc[`${chore.id}-${di}`];
                          return (
                            <td key={di} style={{textAlign:"center",padding:"6px 3px"}}>
                              <button onClick={()=>toggleChore(chore.id,di)}
                                disabled={role!=="kid"}
                                style={{width:32,height:32,borderRadius:9,border:"none",
                                  fontSize:17,fontWeight:900,color:"#fff",
                                  background:done?"#6bcb77":"#eeeeee",
                                  transform:done?"scale(1.15)":"scale(1)",
                                  transition:"all .15s",
                                  cursor:role==="kid"?"pointer":"default",
                                  display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
                                {done?"✓":""}
                              </button>
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {role==="kid" && (
                <div style={{marginTop:18,background:"linear-gradient(135deg,#6bcb77,#4d96ff)",
                  color:"#fff",borderRadius:18,padding:"14px 20px",textAlign:"center",
                  fontFamily:"'Fredoka One',cursive",fontSize:17,
                  boxShadow:"0 4px 16px rgba(107,203,119,0.3)"}}>
                  {data.totalStars<5?"Keep going! Every chore earns you stars! 💪"
                    :data.totalStars<15?"You're on a roll! Check out the rewards! 🚀"
                    :"WOW — you're a chore superstar! 🌟"}
                </div>
              )}
            </div>
          )}

          {/* ── Rewards ── */}
          {view==="rewards" && (
            <div style={{maxWidth:860,margin:"0 auto",padding:"18px 14px"}}>
              <div style={{background:"linear-gradient(135deg,#ffd93d,#ff9f1c)",borderRadius:16,
                padding:"13px 18px",fontFamily:"'Fredoka One',cursive",fontSize:19,color:"#fff",
                textAlign:"center",marginBottom:18,boxShadow:"0 4px 16px rgba(255,159,28,0.3)"}}>
                You have <strong>{data.totalStars} ⭐</strong> to spend!
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:14,marginBottom:22}}>
                {data.rewards.map(r=>{
                  const can = data.totalStars>=r.cost;
                  return (
                    <div key={r.id} style={{background:"#fff",borderRadius:20,padding:"18px 14px",
                      textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.08)",
                      display:"flex",flexDirection:"column",alignItems:"center",gap:5,
                      opacity:can?1:0.65}}>
                      <div style={{fontSize:38}}>{r.emoji}</div>
                      <div style={{fontWeight:800,fontSize:13,color:"#333"}}>{r.name}</div>
                      <div style={{fontFamily:"'Fredoka One',cursive",fontSize:17,color:"#f6a21e"}}>{r.cost} ⭐</div>
                      {role==="kid" && (
                        <button onClick={()=>claimReward(r)} disabled={!can} style={{
                          marginTop:6,border:"none",borderRadius:11,padding:"7px 13px",color:"#fff",
                          fontFamily:"'Fredoka One',cursive",fontSize:13,
                          background:can?"#ff6b6b":"#ccc",cursor:can?"pointer":"not-allowed"}}>
                          {can?"Claim! 🎉":`Need ${r.cost-data.totalStars} more ⭐`}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
              {data.history?.length>0 && (
                <div style={{background:"#fff",borderRadius:16,padding:"15px 18px",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
                  <div style={{fontFamily:"'Fredoka One',cursive",fontSize:17,color:"#555",marginBottom:10}}>📜 Recent History</div>
                  {data.history.slice(0,8).map((h,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"6px 0",borderBottom:"1px solid #f0f0f0",fontSize:13,fontWeight:600,color:"#444",gap:8}}>
                      <span style={{color:"#888",fontSize:11}}>{h.date}</span>
                      <span style={{flex:1}}>{h.action}</span>
                      <span style={{color:h.stars>0?"#6bcb77":"#ff6b6b",fontWeight:700}}>
                        {h.stars>0?`+${h.stars}`:h.stars} ⭐
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ── Manage (Parent only) ── */}
          {view==="manage" && role==="parent" && (
            <div style={{maxWidth:860,margin:"0 auto",padding:"18px 14px"}}>

              {/* Chores */}
              <div style={{background:"#fff",borderRadius:20,padding:"18px",marginBottom:18,boxShadow:"0 2px 16px rgba(0,0,0,0.07)"}}>
                <div style={{fontFamily:"'Fredoka One',cursive",fontSize:19,color:"#ff6b6b",marginBottom:12}}>📋 Manage Chores</div>
                {data.chores.map(c=>(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 2px",
                    borderBottom:"1px solid #f5f5f5",fontSize:14,color:"#333"}}>
                    <span style={{fontSize:19}}>{c.emoji}</span>
                    <span style={{flex:1,fontWeight:600}}>{c.name}</span>
                    <span style={{color:"#f6a21e",fontSize:13}}>{c.stars}⭐</span>
                    <button onClick={()=>removeChore(c.id)} style={{background:"#ffeeee",color:"#ff6b6b",
                      border:"none",borderRadius:8,padding:"3px 9px",fontSize:13,fontWeight:900,cursor:"pointer"}}>✕</button>
                  </div>
                ))}
                <div style={{display:"flex",gap:7,marginTop:12,flexWrap:"wrap",alignItems:"center"}}>
                  <input value={newChore.emoji} maxLength={2}
                    onChange={e=>setNewChore({...newChore,emoji:e.target.value})}
                    style={{width:42,padding:"7px",border:"2px solid #ffe0c0",borderRadius:10,fontSize:19,textAlign:"center"}}/>
                  <input value={newChore.name} placeholder="New chore…"
                    onChange={e=>setNewChore({...newChore,name:e.target.value})}
                    style={{flex:1,minWidth:110,padding:"7px 11px",border:"2px solid #ffe0c0",borderRadius:10,fontSize:13,fontFamily:"'Nunito',sans-serif",fontWeight:700}}/>
                  <select value={newChore.stars} onChange={e=>setNewChore({...newChore,stars:Number(e.target.value)})}
                    style={{padding:"7px 9px",border:"2px solid #ffe0c0",borderRadius:10,fontSize:13,fontFamily:"'Nunito',sans-serif",fontWeight:700,background:"#fff"}}>
                    <option value={1}>1⭐</option><option value={2}>2⭐</option><option value={3}>3⭐</option>
                  </select>
                  <button onClick={addChore} style={{background:"linear-gradient(135deg,#6bcb77,#4d96ff)",color:"#fff",
                    border:"none",borderRadius:10,padding:"7px 16px",fontFamily:"'Fredoka One',cursive",fontSize:14,cursor:"pointer"}}>Add</button>
                </div>
              </div>

              {/* Rewards */}
              <div style={{background:"#fff",borderRadius:20,padding:"18px",marginBottom:18,boxShadow:"0 2px 16px rgba(0,0,0,0.07)"}}>
                <div style={{fontFamily:"'Fredoka One',cursive",fontSize:19,color:"#ff6b6b",marginBottom:12}}>🎁 Manage Rewards</div>
                {data.rewards.map(r=>(
                  <div key={r.id} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 2px",
                    borderBottom:"1px solid #f5f5f5",fontSize:14,color:"#333"}}>
                    <span style={{fontSize:19}}>{r.emoji}</span>
                    <span style={{flex:1,fontWeight:600}}>{r.name}</span>
                    <span style={{color:"#f6a21e",fontSize:13}}>{r.cost}⭐</span>
                    <button onClick={()=>removeReward(r.id)} style={{background:"#ffeeee",color:"#ff6b6b",
                      border:"none",borderRadius:8,padding:"3px 9px",fontSize:13,fontWeight:900,cursor:"pointer"}}>✕</button>
                  </div>
                ))}
                <div style={{display:"flex",gap:7,marginTop:12,flexWrap:"wrap",alignItems:"center"}}>
                  <input value={newReward.emoji} maxLength={2}
                    onChange={e=>setNewReward({...newReward,emoji:e.target.value})}
                    style={{width:42,padding:"7px",border:"2px solid #ffe0c0",borderRadius:10,fontSize:19,textAlign:"center"}}/>
                  <input value={newReward.name} placeholder="New reward…"
                    onChange={e=>setNewReward({...newReward,name:e.target.value})}
                    style={{flex:1,minWidth:110,padding:"7px 11px",border:"2px solid #ffe0c0",borderRadius:10,fontSize:13,fontFamily:"'Nunito',sans-serif",fontWeight:700}}/>
                  <input type="number" min={1} max={99} value={newReward.cost}
                    onChange={e=>setNewReward({...newReward,cost:Number(e.target.value)})}
                    style={{width:56,padding:"7px 9px",border:"2px solid #ffe0c0",borderRadius:10,fontSize:13,fontFamily:"'Nunito',sans-serif",fontWeight:700}}/>
                  <button onClick={addReward} style={{background:"linear-gradient(135deg,#6bcb77,#4d96ff)",color:"#fff",
                    border:"none",borderRadius:10,padding:"7px 16px",fontFamily:"'Fredoka One',cursive",fontSize:14,cursor:"pointer"}}>Add</button>
                </div>
              </div>

              {/* Adjust stars */}
              <div style={{background:"#fff",borderRadius:20,padding:"18px",marginBottom:18,boxShadow:"0 2px 16px rgba(0,0,0,0.07)"}}>
                <div style={{fontFamily:"'Fredoka One',cursive",fontSize:19,color:"#ff6b6b",marginBottom:12}}>⭐ Adjust Stars</div>
                <div style={{display:"flex",gap:9,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontFamily:"'Fredoka One',cursive",fontSize:17}}>Total: {data.totalStars} ⭐</span>
                  {[1,5,10].map(n=>(
                    <button key={n} onClick={()=>adjustStars(n)} style={{background:"#6bcb77",color:"#fff",border:"none",
                      borderRadius:10,padding:"7px 14px",fontFamily:"'Fredoka One',cursive",fontSize:15,cursor:"pointer"}}>+{n}</button>
                  ))}
                  {[1,5].map(n=>(
                    <button key={n} onClick={()=>adjustStars(-n)} style={{background:"#ff6b6b",color:"#fff",border:"none",
                      borderRadius:10,padding:"7px 14px",fontFamily:"'Fredoka One',cursive",fontSize:15,cursor:"pointer"}}>−{n}</button>
                  ))}
                </div>
              </div>

              {/* Share / Install */}
              <div style={{background:"linear-gradient(135deg,#e8f4ff,#f0fff4)",borderRadius:20,padding:"18px",
                border:"2px dashed #4d96ff",marginBottom:18}}>
                <div style={{fontFamily:"'Fredoka One',cursive",fontSize:19,color:"#4d96ff",marginBottom:8}}>📱 Add to Home Screen</div>
                <p style={{fontSize:13,color:"#555",lineHeight:1.6,marginBottom:12}}>
                  <strong>iPhone:</strong> Open in Safari → tap Share (□↑) → "Add to Home Screen"<br/>
                  <strong>Android:</strong> Open in Chrome → tap ⋮ menu → "Add to Home Screen"
                </p>
                <button onClick={shareApp} style={{background:"linear-gradient(135deg,#4d96ff,#6bcb77)",color:"#fff",
                  border:"none",borderRadius:12,padding:"11px 22px",fontFamily:"'Fredoka One',cursive",
                  fontSize:15,cursor:"pointer",boxShadow:"0 4px 16px rgba(77,150,255,0.3)"}}>
                  Share with Mum 📤
                </button>
              </div>

            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
